<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano to Sheet</title>
<meta name="theme-color" content="#1d1b18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #1d1b18; --panel: #2a2723; --ink: #f3ede2; --muted: #a59d90;
    --accent: #e8b04a; --rec: #e0533d; --paper: #fbf8f1; --line: #3a362f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0 10px; }
  h1 { font: 600 20px/1 Georgia, serif; margin: 0; letter-spacing: .3px; }
  #midiStatus { font-size: 13px; color: var(--muted); text-align: right; }
  #midiStatus.ok { color: #8fd18a; }
  .panel { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  select, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 44px; width: 100%; }
  button { font: 600 16px system-ui, sans-serif; border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; cursor: pointer; color: var(--bg); background: var(--accent); }
  button.secondary { background: var(--line); color: var(--ink); }
  button:disabled { opacity: .45; }
  .full { grid-column: 1 / -1; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > button { flex: 1 1 auto; }
  #recBtn { width: 100%; min-height: 64px; font-size: 20px; background: var(--rec); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #recBtn .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  #recBtn.on .dot { border-radius: 3px; }
  #crossBtn { width: 100%; min-height: 64px; margin-top: 10px; font-size: 18px; background: var(--line); color: var(--ink); }
  #crossBtn.on { background: #7b5cd6; color: #fff; }
  #beat { display: flex; gap: 6px; justify-content: center; margin-top: 10px; min-height: 12px; }
  #beat i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  #beat i.hit { background: var(--accent); }
  #info { font-size: 14px; color: var(--muted); margin-top: 8px; text-align: center; min-height: 20px; }
  #sheetWrap { background: var(--paper); border-radius: 14px; padding: 8px; min-height: 160px; color: #222; overflow: hidden; }
  #sheet .playing { fill: #e0533d; stroke: #e0533d; }
  #sheetWrap .empty { color: #8a8174; text-align: center; padding: 50px 10px; font: italic 16px Georgia, serif; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 0; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  #printSheet { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff; padding: 0; }
    header, .panel, .noprint, #sheetWrap { display: none !important; }
    /* one picture per line of music: a line is never cut by a page break */
    /* abcjs makes the container inline-block, which Chrome won't split across pages (it clips) */
    #printSheet { display: block !important; overflow: visible !important; color: #000; }
    #printSheet > div { display: block; break-inside: avoid; page-break-inside: avoid; }
    #printSheet svg { display: block; width: 100%; height: auto; margin-bottom: 3mm; }
  }
</style>
</head>
<body>
<header>
  <h1>Piano → Sheet</h1>
  <div id="midiStatus">MIDI not connected</div>
</header>

<div class="panel">
  <div class="row"><button id="connectBtn">Connect piano (MIDI)</button></div>
  <div class="grid" style="margin-top:12px">
    <label>Tempo (beats/min)<input id="bpm" type="number" min="30" max="240" value="" placeholder="auto" inputmode="numeric">
      <button class="secondary" id="tapBtn" type="button" style="min-height:40px;margin-top:4px">👆 Tap tempo</button></label>
    <label>Time signature
      <select id="meter"><option value="auto">Auto (find it)</option><option>4/4</option><option>3/4</option><option>2/4</option><option>5/4</option><option>6/4</option><option>2/2</option><option>3/8</option><option>6/8</option><option>9/8</option><option>12/8</option></select>
    </label>
    <label>Shortest note
      <select id="grid"><option value="1">16th</option><option value="2">8th</option></select>
    </label>
    <label>Held notes
      <select id="heldVoice"><option value="0">Simple (normal notes)</option><option value="1">Show as 2nd voice</option></select>
    </label>
    <label>Triplets
      <select id="trip"><option value="0">No triplets</option><option value="1">Song has triplets</option></select>
    </label>
    <label>Hands
      <select id="hands">
        <option value="auto">Auto (smart)</option>
        <option value="fixed">Fixed split</option>
      </select>
    </label>
    <div id="splitRow" class="full" hidden>
      <label>Left hand plays up to (this note and lower)
        <select id="lhTop"></select>
      </label>
      <button class="secondary" id="setKeyBtn" style="width:100%;margin-top:8px">🎹 Set by pressing a key on the piano</button>
      <label style="margin-top:10px">When hands are crossed, left hand plays from (this note and higher)
        <select id="crossFrom"></select>
      </label>
      <button class="secondary" id="setCrossBtn" style="width:100%;margin-top:8px">🎹 Set by pressing a key on the piano</button>
    </div>
    <label>Key
      <select id="key"><option value="auto">Auto-detect</option></select>
    </label>
    <label>Title<input id="title" value="My Song"></label>
    <label>Metronome
      <select id="click">
        <option value="free">Off – I play freely (tempo found automatically)</option>
        <option value="1">On</option>
        <option value="quiet">Quiet</option>
        <option value="0">Count-in only</option>
        <option value="silent">Silent (dots only)</option>
      </select>
    </label>
  </div>
  <p class="hint" id="clickHint"></p>
  <details style="margin-top:10px">
    <summary>Timing calibration</summary>
    <div class="grid" style="margin-top:8px">
      <label>Latency offset (ms)<input id="latency" type="number" value="0" step="10" inputmode="numeric"></label>
    </div>
    <p class="hint">If every note lands a little late (or early) on the sheet, raise (or lower) the offset.</p>
  </details>
</div>

<div class="panel">
  <button id="recBtn" disabled><span class="dot"></span><span id="recLabel">Record</span></button>
  <button id="crossBtn" hidden>✋ Cross hands</button>
  <div id="beat"></div>
  <div id="info">Connect your piano, then press Record. You get a one-bar count-in.</div>
</div>

<div class="row noprint" id="scaleRow" hidden style="margin-bottom:8px">
  <button class="secondary" id="longerBtn">Notes look too short → ×2</button>
  <button class="secondary" id="shorterBtn">Notes look too long → ÷2</button>
</div>
<div id="sheetWrap"><div id="sheet"><div class="empty">Your sheet music appears here.</div></div></div>
<div id="printSheet"></div>

<div class="row noprint" style="margin-top:12px">
  <button class="secondary" id="playBtn" disabled>▶ Play sheet</button>
  <button class="secondary" id="pdfBtn" disabled>Save PDF</button>
  <button class="secondary" id="abcBtn" disabled>ABC</button>
  <button class="secondary" id="midBtn" disabled>MIDI</button>
</div>
<div class="row noprint" style="margin-top:8px"><button class="secondary" id="rawBtn" disabled>Save raw recording (for checking)</button></div>
<div class="row noprint" style="margin-top:8px"><button class="secondary" id="demoBtn">Try a demo (no piano needed)</button></div>

<script>
  // Show problems on screen instead of a blank page.
  window.onerror = (msg, src, line) => { const i = document.getElementById('info'); if (i) i.textContent = `Error: ${msg} (${(src || '').split('/').pop()}:${line})`; };
  window.addEventListener('unhandledrejection', (e) => window.onerror(String(e.reason), '', 0));
  setTimeout(() => { if (!window.__appReady) { const i = document.getElementById('info'); if (i && !i.textContent.startsWith('Error')) i.textContent = 'The app did not start in this browser. Please open it in Google Chrome (Android) and update Chrome.'; } }, 4000);
</script>
<script src="vendor/abcjs-basic-min.js"></script>
<script type="module">
import { transcribe, keyName, METERS } from './notation.js';
import { SONGS, perform } from './songs.js';

const $ = (id) => document.getElementById(id);
const els = ['bpm', 'meter', 'grid', 'heldVoice', 'trip', 'hands', 'lhTop', 'crossFrom', 'key', 'title', 'latency', 'click'];
let notes = [];          // [{p, t, off}] ms relative to bar 1 downbeat
let pending = new Map(); // pitch -> onset
let tempoScale = 1;      // free mode: x2 / /2 if the beat was found at the wrong level
let crossMarks = [];     // ms from bar 1 where "cross hands" was tapped (each tap toggles)
let recording = false, t0 = 0, audio, timer, lastAbc = '', visual, midiCount = 0;

// key options
for (let f = -7; f <= 7; f++) for (const minor of [false, true]) {
  const o = document.createElement('option');
  o.value = `${f},${minor ? 1 : 0}`; o.textContent = keyName({ fifths: f, minor }).replace('m', ' minor').replace(/^([A-G][#b]?)$/, '$1 major');
  $('key').append(o);
}

// note list for the fixed split: "G3 (g)" = scientific name + German/Helmholtz name
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = (m) => NAMES[m % 12] + (Math.floor(m / 12) - 1);
function helmholtz(m) {
  const n = NAMES[m % 12].replace('B', 'H').replace('#', 'is'), o = Math.floor(m / 12) - 1; // German: B = H, F# = Fis
  return o >= 3 ? n.toLowerCase() + "'".repeat(o - 3) : n + ','.repeat(2 - o);
}
for (const [sel, hi, lo] of [['lhTop', 84, 36], ['crossFrom', 96, 48]]) for (let m = hi; m >= lo; m--) {
  const o = document.createElement('option');
  o.value = m; o.textContent = `${noteName(m)} (${helmholtz(m)})${m === 60 ? ' — middle C' : ''}`;
  $(sel).append(o);
}
$('lhTop').value = 59; $('crossFrom').value = 72;
const showSplit = () => { $('splitRow').hidden = $('hands').value !== 'fixed'; };
$('hands').addEventListener('change', showSplit);

// persist settings + last take (best effort)
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const saved = store.get('settings') || {};
if (typeof saved.hands === 'string' && saved.hands.startsWith('fixed:')) { saved.lhTop = +saved.hands.slice(6) - 1; saved.hands = 'fixed'; } // old format
for (const id of els) if (saved[id] != null) $(id).value = saved[id];
showSplit();
{ const take = store.get('take'); notes = Array.isArray(take) ? take : take?.notes || []; crossMarks = take?.cross || []; tempoScale = take?.scale || 1; }
for (const id of els) $(id).addEventListener('change', () => {
  store.set('settings', Object.fromEntries(els.map((i) => [i, $(i).value])));
  render();
});

function opts() {
  const kv = $('key').value, free = $('click').value === 'free';
  return {
    free, // in free mode the tempo is only a hint for finding the beat
    bpm: free ? +$('bpm').value || 0 : +$('bpm').value || 80, // free + empty = find the tempo
    scale: free ? tempoScale : 1, meter: $('meter').value, grid: +$('grid').value,
    heldVoice: $('heldVoice').value === '1', crossFrom: +$('crossFrom').value,
    hands: $('hands').value, splitPoint: +$('lhTop').value + 1, title: $('title').value || 'My Song',
    key: kv === 'auto' ? 'auto' : { fifths: +kv.split(',')[0], minor: kv.endsWith(',1') },
    barsPerLine: innerWidth < 600 ? 2 : 4,
    triplets: $('trip').value === '1', // off unless asked: timing wobble otherwise looks like triplets
    cross: crossMarks,
  };
}

function render() {
  const has = notes.length > 0;
  for (const b of ['playBtn', 'pdfBtn', 'abcBtn', 'midBtn', 'rawBtn']) $(b).disabled = !has;
  if (!has) return;
  const r = transcribe(notes, opts());
  lastAbc = r.abc;
  if (!r.abc) {
    $('sheet').innerHTML = `<div class="empty">${notes.length} notes were received, but none landed after the count-in. Start playing after the 4 count-in clicks.</div>`;
    return;
  }
  if (synth) stopPlayback();
  try {
    [visual] = ABCJS.renderAbc('sheet', r.abc, { responsive: 'resize', add_classes: true, paddingleft: 0, paddingright: 0 });
  } catch (e) {
    $('sheet').innerHTML = `<div class="empty">Sorry, this sheet couldn't be drawn (${e.message}). Your recording is safe: tap "Save raw recording" and send the file.</div>`;
    return;
  }
  if (!recording && r.key) $('info').textContent = `${notes.length} notes · key ${keyName(r.key)} · RH ${r.rh.length} / LH ${r.lh.length}${opts().meter === 'auto' ? ` · ${r.meter}` : ''}${opts().free ? ` · tempo ≈ ${r.bpm}` : ''}`;
  $('scaleRow').hidden = recording || !opts().free;
}

// ---------- MIDI ----------
let waitingForKey = false; // false | 'lhTop' | 'crossFrom'
const keyBtn = { lhTop: 'setKeyBtn', crossFrom: 'setCrossBtn' };
const keyPrompt = { lhTop: '🎹 Now press the highest left-hand key…', crossFrom: '🎹 Now press the lowest key the crossed left hand plays…' };
for (const [what, btn] of Object.entries(keyBtn)) $(btn).onclick = () => {
  waitingForKey = waitingForKey === what ? false : what;
  for (const [w, b] of Object.entries(keyBtn)) $(b).textContent = waitingForKey === w ? keyPrompt[w] : '🎹 Set by pressing a key on the piano';
};

function onMidi(e) {
  const [st, p, v] = e.data, cmd = st & 0xf0;
  if (waitingForKey && !recording && cmd === 0x90 && v > 0) {
    const what = waitingForKey; waitingForKey = false;
    const sel = $(what), opts_ = [...sel.options].map((o) => +o.value);
    sel.value = Math.min(Math.max(...opts_), Math.max(Math.min(...opts_), p));
    sel.dispatchEvent(new Event('change')); // saves + redraws
    $(keyBtn[what]).textContent = '🎹 Set by pressing a key on the piano';
    $('info').textContent = what === 'lhTop' ? `Left hand now plays ${noteName(+sel.value)} and everything below.` : `When crossed, the left hand plays ${noteName(+sel.value)} and higher.`;
    return;
  }
  if (!recording) return;
  midiCount++;
  // Some Android devices stamp MIDI events with another clock (or 0): fall back to "now".
  const ts = Math.abs(e.timeStamp - performance.now()) < 1000 ? e.timeStamp : performance.now();
  const t = ts - t0 - (+$('latency').value || 0) - (audio.outputLatency || audio.baseLatency || 0) * 1000;
  if (cmd === 0x90 && v > 0) {
    if (pending.has(p)) notes.push({ p, t: pending.get(p), off: t });
    pending.set(p, t);
  } else if (cmd === 0x80 || (cmd === 0x90 && v === 0)) {
    if (pending.has(p)) { notes.push({ p, t: pending.get(p), off: t }); pending.delete(p); liveRender(); }
  }
}
let liveTimer;
function liveRender() { clearTimeout(liveTimer); liveTimer = setTimeout(render, 400); }

async function connect() {
  if (!navigator.requestMIDIAccess) {
    $('midiStatus').textContent = 'This browser has no Web MIDI. Use Chrome on Android/desktop.';
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess();
    const bind = () => {
      const names = [];
      access.inputs.forEach((i) => { i.onmidimessage = onMidi; names.push(i.name); });
      $('midiStatus').textContent = names.length ? '● ' + names.join(', ') : 'No MIDI device found – plug in & retry';
      $('midiStatus').className = names.length ? 'ok' : '';
      $('recBtn').disabled = !names.length;
    };
    access.onstatechange = bind;
    bind();
  } catch (err) {
    $('midiStatus').textContent = 'MIDI permission denied';
  }
}
$('connectBtn').onclick = connect;
// reconnect by itself when MIDI was allowed before (no prompt needed)
navigator.permissions?.query({ name: 'midi' }).then((st) => { if (st.state === 'granted') connect(); }).catch(() => {});

// ---------- metronome + recording ----------
function click(time, accent) {
  const quiet = $('click').value === 'quiet';
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = quiet ? (accent ? 900 : 700) : accent ? 1500 : 1000;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(quiet ? 0.12 : 0.6, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
  o.connect(g).connect(audio.destination);
  o.start(time); o.stop(time + 0.07);
}

async function start() {
  audio = audio || new AudioContext();
  await audio.resume();
  const o = opts();
  notes = []; pending.clear(); midiCount = 0; tempoScale = 1;
  crossMarks = []; $('crossBtn').hidden = false; crossLabel();
  $('recBtn').classList.add('on'); $('recLabel').textContent = 'Stop';
  $('sheet').innerHTML = '<div class="empty">Listening…</div>';
  if (o.free) { // no metronome: just record; the beat is found afterwards
    t0 = performance.now(); recording = true;
    timer = setInterval(() => { $('info').textContent = `Recording freely · ${notes.length} notes (${midiCount} MIDI messages)${crossMarks.length % 2 ? ' · hands crossed' : ''}`; }, 250);
    return;
  }
  const mt = METERS[o.meter] || METERS['4/4']; // Auto: count 4 with the metronome
  const beats = mt.bar / mt.beat; // 6/8 clicks dotted quarters
  const beatSec = 60 / o.bpm;
  const lead = 0.15;
  const aStart = audio.currentTime + lead;
  const pStart = performance.now() + lead * 1000;
  t0 = pStart + beats * beatSec * 1000; // downbeat of bar 1, after the count-in
  recording = true;
  $('beat').innerHTML = '<i></i>'.repeat(beats);
  let k = 0;
  const mode = $('click').value; // '1' on, 'quiet', '0' count-in only, 'silent'
  const audible = (k) => mode !== 'silent' && (k < beats || mode === '1' || mode === 'quiet');
  timer = setInterval(() => {
    while (aStart + k * beatSec < audio.currentTime + 0.2) {
      if (audible(k)) click(aStart + k * beatSec, k % beats === 0);
      // dots flash when the click is actually heard (phones delay audio output)
      const idx = k % beats, delay = (aStart + k * beatSec - audio.currentTime + (audio.outputLatency || audio.baseLatency || 0)) * 1000, countIn = k < beats;
      setTimeout(() => {
        [...$('beat').children].forEach((d, i) => d.classList.toggle('hit', i === idx));
        $('info').textContent = countIn ? `Count-in… ${beats - idx}` : `Recording · ${notes.length} notes (${midiCount} MIDI messages)${crossMarks.length % 2 ? ' · hands crossed' : ''}`;
      }, delay);
      k++;
    }
  }, 25);
}

function stop() {
  recording = false;
  clearInterval(timer);
  const now = performance.now() - t0;
  pending.forEach((t, p) => notes.push({ p, t, off: now }));
  pending.clear();
  notes.sort((a, b) => a.t - b.t);
  store.set('take', { notes, cross: crossMarks, scale: tempoScale });
  $('crossBtn').hidden = true;
  $('beat').innerHTML = '';
  $('recBtn').classList.remove('on'); $('recLabel').textContent = 'Record again';
  if (!notes.length) {
    $('info').textContent = midiCount ? `Received ${midiCount} MIDI messages but no complete notes.` : 'No notes received from the piano. Check the cable, then tap Connect again.';
    $('sheet').innerHTML = '<div class="empty">Nothing recorded.</div>';
    return;
  }
  render();
}
$('recBtn').onclick = () => (recording ? stop() : start());

// Tap when you switch to (or back from) crossed hands. Take your time: the empty bars of
// the pause are cut out, and the next part starts on the next bar of the sheet.
function crossLabel() {
  const on = crossMarks.length % 2 === 1;
  $('crossBtn').classList.toggle('on', on);
  $('crossBtn').textContent = on ? '✋ Hands crossed — tap to go back to normal' : '✋ Cross hands';
}
$('crossBtn').onclick = () => { if (recording) { crossMarks.push(performance.now() - t0); crossLabel(); } };

// ---------- outputs ----------
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fname = () => ($('title').value || 'song').replace(/[^\w-]+/g, '_');
$('abcBtn').onclick = () => download(fname() + '.abc', lastAbc, 'text/plain');
$('midBtn').onclick = () => download(fname() + '.mid', ABCJS.synth.getMidiFile(lastAbc, { midiOutputType: 'binary' })[0], 'audio/midi');
// Print / PDF: a separate layout (4 bars per line, one SVG per line, A4)
function preparePrint() {
  if (!notes.length) return;
  const r = transcribe(notes, { ...opts(), barsPerLine: 4 });
  if (r.abc) ABCJS.renderAbc('printSheet', r.abc, { oneSvgPerLine: true, responsive: 'resize', paddingleft: 0, paddingright: 0 });
}
addEventListener('beforeprint', preparePrint); // also when printing from the browser menu
$('pdfBtn').onclick = () => { preparePrint(); print(); };
// exactly what the piano sent (ms from bar 1) + settings, so a take can be re-checked offline
$('rawBtn').onclick = () => download(fname() + '-raw.json', JSON.stringify({ settings: opts(), notes }), 'application/json');

// Plays the written sheet (not the recording), highlighting each note as it sounds,
// so you can hear whether the notation is right.
let synth, follow;
function stopPlayback() {
  synth?.stop(); follow?.stop();
  synth = follow = null;
  document.querySelectorAll('#sheet .playing').forEach((e) => e.classList.remove('playing'));
  $('playBtn').textContent = '▶ Play sheet';
}
$('playBtn').onclick = async () => {
  if (synth) return stopPlayback();
  if (!visual) return;
  $('playBtn').textContent = 'Loading piano…';
  try {
    audio = audio || new AudioContext(); await audio.resume();
    synth = new ABCJS.synth.CreateSynth();
    // options: {} is required: abcjs 6.4 reads options.swing without a guard
    await synth.init({ visualObj: visual, audioContext: audio, millisecondsPerMeasure: visual.millisecondsPerMeasure(), options: {} });
    await synth.prime();
    follow = new ABCJS.TimingCallbacks(visual, {
      eventCallback: (ev) => {
        document.querySelectorAll('#sheet .playing').forEach((e) => e.classList.remove('playing'));
        if (!ev) { stopPlayback(); return; } // reached the end
        ev.elements.forEach((group) => group.forEach((el) => el.classList.add('playing')));
      },
    });
    synth.start(); follow.start();
    $('playBtn').textContent = '■ Stop';
  } catch (e) {
    stopPlayback();
    const msg = e?.message || (Array.isArray(e) ? e.map((x) => x?.message || x?.status || x).join(', ') : String(e));
    $('info').textContent = navigator.onLine ? `Couldn't play the sheet: ${msg}` : 'Playback needs an internet connection the first time (the piano sound downloads once).';
  }
};

// ---------- tempo: tap along, and fix double/half note values afterwards ----------
let taps = [];
$('tapBtn').onclick = () => {
  const now = performance.now();
  taps = taps.filter((t) => now - t < 3000).concat(now); // a pause starts a new tapping
  if (taps.length >= 3) {
    const iv = taps.slice(1).map((t, i) => t - taps[i]).sort((a, b) => a - b);
    $('bpm').value = Math.round(60000 / iv[iv.length >> 1]);
    $('bpm').dispatchEvent(new Event('change'));
  }
  $('tapBtn').textContent = taps.length < 3 ? `👆 Tap tempo (${taps.length}/3…)` : `👆 Tap tempo: ${$('bpm').value}`;
};
const rescale = (f) => { tempoScale *= f; store.set('take', { notes, cross: crossMarks, scale: tempoScale }); render(); };
$('longerBtn').onclick = () => rescale(0.5); // slower beat -> longer note values
$('shorterBtn').onclick = () => rescale(2);
function clickHint() {
  $('clickHint').textContent = $('click').value === 'free'
    ? 'Free playing: press Record and just play. Tempo and beat are found from your playing (leave Tempo empty = auto, or tap it).'
    : 'Play along with the beat, even with the sound off (watch the dots) — the rhythm is measured against it.';
}
$('click').addEventListener('change', clickHint);
clickHint();

// ---------- demo: a humanized performance of a real piece (cycles through them) ----------
let demoIdx = 0;
$('demoBtn').onclick = () => {
  const song = SONGS[demoIdx++ % SONGS.length];
  $('bpm').value = song.bpm; $('meter').value = song.meter; $('title').value = song.name;
  $('key').value = 'auto'; $('hands').value = 'auto'; showSplit();
  $('trip').value = song.name.startsWith('Moonlight') ? '1' : '0'; // only that demo has triplets
  notes = perform(song, Date.now() % 1000).map(({ p, t, off }) => ({ p, t, off }));
  crossMarks = []; tempoScale = 1;
  render();
  $('demoBtn').textContent = `Demo: ${song.name} — tap for next`;
};

try { render(); } catch (e) { $('info').textContent = 'Error: ' + e.message; }
window.__appReady = true;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
